<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？｜嘉義市美食轉盤</title>
<style>
  :root{
    --cream:#fff8e8; --paper:#fffdf6; --ink:#493b32; --green:#86a96b;
    --green-dark:#587746; --yellow:#f4c95d; --orange:#e59a67; --pink:#e9a9a0;
    --blue:#91b8c7; --shadow:0 7px 0 rgba(73,59,50,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);font-family:"Trebuchet MS","Noto Sans TC",system-ui,sans-serif;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 15% 15%,rgba(134,169,107,.13) 0 4px,transparent 5px),
      radial-gradient(circle at 85% 25%,rgba(233,169,160,.13) 0 5px,transparent 6px);
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0}
  .app{min-height:100vh;overflow:hidden}
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;background:rgba(255,253,246,.92);backdrop-filter:blur(8px);
    border-bottom:2px dashed rgba(73,59,50,.16)
  }
  .brand{font-weight:900;font-size:1.2rem;cursor:pointer}
  .nav-btn{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:8px 13px;box-shadow:3px 3px 0 rgba(73,59,50,.18)}
  .screen{display:none;max-width:1050px;margin:auto;padding:48px 22px 70px;min-height:calc(100vh - 62px)}
  .screen.active{display:block}
  .hero{text-align:center;padding-top:7vh}
  .hero h1{font-size:clamp(2.5rem,7vw,5.3rem);margin:12px 0 8px;letter-spacing:.04em}
  .hero p{font-size:1.1rem;margin:0 auto 28px;max-width:600px;line-height:1.8}
  .mascot{
    width:145px;height:145px;margin:0 auto 20px;border-radius:48% 52% 50% 50%;
    background:#f7d6a0;border:4px solid var(--ink);box-shadow:var(--shadow);
    display:grid;place-items:center;font-size:5rem;transform:rotate(-3deg)
  }
  .primary{
    background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:24px;
    padding:15px 26px;font-weight:900;font-size:1.15rem;box-shadow:5px 5px 0 var(--ink);
    transition:.15s transform
  }
  .primary:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  .secondary{
    background:#fff;border:2px solid var(--ink);border-radius:18px;padding:11px 17px;
    box-shadow:3px 3px 0 rgba(73,59,50,.18)
  }
  .section-title{text-align:center;margin-bottom:26px}
  .section-title h2{font-size:2rem;margin:5px}
  .section-title p{margin:0;opacity:.72}
  .choices{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;max-width:850px;margin:25px auto}
  .choice{
    min-height:125px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;
    box-shadow:var(--shadow);padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:.15s
  }
  .choice:hover,.choice.selected{transform:translateY(-4px) rotate(-1deg);background:#f8efcf}
  .choice.selected{outline:4px solid var(--yellow)}
  .choice .emoji{font-size:2.3rem}.choice b{margin-top:7px}
  .map-wrap{max-width:760px;margin:20px auto}
  .map{
    position:relative;min-height:430px;background:#d9edcf;border:4px solid var(--ink);
    border-radius:45% 38% 48% 40%;box-shadow:var(--shadow);overflow:hidden;
    background-image:radial-gradient(#a8c797 1px,transparent 1px);background-size:18px 18px;
  }
  .map:before{content:"";position:absolute;inset:20px;border:2px dashed rgba(73,59,50,.2);border-radius:40% 48% 45% 42%}
  .map-label{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-weight:900;background:#fff;padding:7px 13px;border-radius:15px;border:2px solid var(--ink)}
  .district{
    position:absolute;background:#fff8e8;border:3px solid var(--ink);border-radius:50% 45% 48% 43%;
    padding:17px 23px;font-weight:900;box-shadow:3px 3px 0 rgba(73,59,50,.15);transition:.15s
  }
  .district:hover,.district.selected{background:var(--yellow);transform:scale(1.06) rotate(-2deg)}
  .east{right:18%;top:35%}.west{left:18%;bottom:25%}
  .map-note{text-align:center;margin:14px 0;font-weight:700}
  .filters{max-width:820px;margin:auto;display:grid;gap:22px}
  .filter-card{background:var(--paper);border:3px solid var(--ink);border-radius:25px;padding:22px;box-shadow:var(--shadow)}
  .filter-card h3{margin:0 0 14px}.pills{display:flex;flex-wrap:wrap;gap:10px}
  .pill{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:9px 13px}
  .pill.selected{background:var(--yellow);font-weight:900}
  .diet .pill.selected{background:var(--pink)}
  .filter-actions{text-align:center;margin-top:25px}
  .wheel-area{display:flex;flex-direction:column;align-items:center;gap:22px}
  .wheel-shell{position:relative;width:min(82vw,500px);aspect-ratio:1}
  .pointer{
    position:absolute;z-index:5;top:-8px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid var(--orange);
    filter:drop-shadow(2px 3px 0 var(--ink))
  }
  #wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--ink);box-shadow:0 9px 0 rgba(73,59,50,.15)}
  .spin-btn{font-size:1.25rem;min-width:220px}
  .status-list{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
  .status{padding:7px 11px;border-radius:14px;font-size:.9rem;font-weight:900;border:2px solid var(--ink);background:#fff}
  .green{background:#d8edcf}.yellow{background:#fff0b8}.blue{background:#dcecf1}
  .restaurant-card{
    max-width:700px;margin:30px auto;background:var(--paper);border:4px solid var(--ink);border-radius:30px;
    overflow:hidden;box-shadow:8px 9px 0 rgba(73,59,50,.14);position:relative
  }
  .card-photo-box{
    width:100%;height:300px;background:#eadcc5;display:flex;justify-content:center;align-items:center;overflow:hidden;
  }
  .card-photo{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:25px}.card-body h2{font-size:2rem;margin:0 0 7px}
  .rating{font-weight:900;font-size:1.1rem}.meta{display:grid;gap:8px;margin:17px 0;line-height:1.6}
  .tag-row{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#f4e8c8;border-radius:13px;padding:5px 9px;font-size:.88rem}
  .card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .favorite.active{background:#f3b2aa}
  .empty{text-align:center;padding:50px 20px}
  .empty .big{font-size:4rem}.empty h2{margin:8px}
  .collection-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}
  .collection-head h2{margin:0;font-size:2rem}
  .collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
  .mini-card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
  .mini-card .card-photo-box{height:150px;}
  .mini-body{padding:14px}.mini-body h3{margin:0 0 5px}.mini-body p{margin:4px 0;font-size:.9rem}
  .toast{
    position:fixed;z-index:100;left:50%;bottom:25px;transform:translateX(-50%) translateY(30px);
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:18px;opacity:0;pointer-events:none;transition:.25s
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .small{font-size:.9rem;opacity:.7}
  @media(max-width:750px){
    .choices{grid-template-columns:repeat(2,1fr)}.choices .choice:last-child{grid-column:1/-1}
    .map{min-height:340px}.east{right:12%;top:38%}.west{left:12%;bottom:23%}
    .collection-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:500px){
    .topbar{padding:11px 14px}.screen{padding:35px 14px 55px}
    .hero{padding-top:5vh}.hero h1{font-size:2.6rem}.mascot{width:115px;height:115px;font-size:4rem}
    .collection-grid{grid-template-columns:1fr}.card-photo-box{height:230px}
  }

  .cute-clock{
    position:fixed;right:18px;bottom:18px;z-index:50;width:108px;height:108px;
    background:#fffdf6;border:3px solid var(--ink);border-radius:46% 54% 50% 50%;
    box-shadow:5px 6px 0 rgba(73,59,50,.16);display:grid;place-items:center;
    transform:rotate(2deg);pointer-events:none
  }
  .cute-clock:before{content:"";position:absolute;inset:7px;border:2px dashed rgba(73,59,50,.22);border-radius:50%}
  .clock-face{text-align:center;position:relative;z-index:1}
  .clock-time{font-size:1.18rem;font-weight:900;letter-spacing:.03em}
  .clock-label{font-size:.72rem;margin-top:2px;opacity:.72}
  .clock-mood{font-size:1.2rem;line-height:1}
  @media(max-width:500px){.cute-clock{width:82px;height:82px;right:10px;bottom:10px}.clock-time{font-size:.9rem}.clock-label{font-size:.58rem}.clock-mood{font-size:1rem}}

  .music-toggle{
    position:static;z-index:10;flex:0 0 auto;
    border:3px solid var(--ink);background:#fffdf6;color:var(--ink);
    border-radius:18px;padding:8px 12px;font-weight:900;cursor:pointer;
    box-shadow:4px 5px 0 rgba(73,59,50,.14);font-family:inherit;
  }
  .music-toggle.on{transform:rotate(-2deg);background:#f7edc8}
  .music-note{display:inline-block;margin-right:5px}
  .topbar-actions{display:flex;align-items:center;gap:10px}
  @media(max-width:650px){
    .topbar{flex-wrap:wrap;gap:8px}
    .topbar-actions{width:100%;justify-content:flex-end}
  }
  @media(max-width:500px){.music-toggle{padding:7px 10px}}
</style>
</head>
<body>
<div class="app">

  <div class="cute-clock"><div class="clock-face"><div class="clock-mood">🕐</div><div id="cuteTime" class="clock-time">--:--</div><div id="cuteTimeLabel" class="clock-label">準備吃飯</div></div></div>
  <header class="topbar">
    <div class="brand" onclick="showScreen('home')">🍜 今天吃什麼？</div>
    <div class="topbar-actions">
      <button id="musicToggle" class="music-toggle" type="button" onclick="toggleMusic()" aria-label="開關背景音樂">
        <span class="music-note">🎵</span><span id="musicText">音效特效 ON</span>
      </button>
      <button class="nav-btn" onclick="showScreen('collection')">📖 我的美食圖鑑</button>
    </div>
  </header>

  <main>
    <section id="home" class="screen active">
      <div class="hero">
        <div class="mascot">🐱</div>
        <h1>今天吃什麼？</h1>
        <p>肚子餓了嗎？<br>讓我們一起找點好吃的吧！</p>
        <button class="primary" onclick="showScreen('meal')">🍴 開始覓食！</button>
      </div>
    </section>

    <section id="meal" class="screen">
      <div class="section-title">
        <h2>🌱 今天想吃哪一餐？</h2><p>先告訴我現在是什麼時段吧！</p>
      </div>
      <div class="choices">
        <button class="choice" data-meal="早餐" onclick="selectMeal(this)"><span class="emoji">🌅</span><b>早餐</b></button>
        <button class="choice" data-meal="午餐" onclick="selectMeal(this)"><span class="emoji">☀️</span><b>午餐</b></button>
        <button class="choice" data-meal="晚餐" onclick="selectMeal(this)"><span class="emoji">🌇</span><b>晚餐</b></button>
        <button class="choice" data-meal="點心" onclick="selectMeal(this)"><span class="emoji">🍰</span><b>點心</b></button>
        <button class="choice" data-meal="消夜" onclick="selectMeal(this)"><span class="emoji">🌙</span><b>消夜</b></button>
      </div>
      <div style="text-align:center"><button class="primary" onclick="goDistrict()">下一步 →</button></div>
    </section>

    <section id="district" class="screen">
      <div class="section-title">
        <h2>🗺️ 今天想去哪裡吃？</h2><p>點一下嘉義市的地區</p>
      </div>
      <div class="map-wrap">
        <div class="map">
          <div class="map-label">🍀 嘉義市</div>
          <button class="district east" data-district="東區" onclick="selectDistrict(this)">🌳 東區</button>
          <button class="district west" data-district="西區" onclick="selectDistrict(this)">🏡 西區</button>
        </div>
        <div id="districtNote" class="map-note">還沒有選擇地區</div>
      </div>
      <div style="text-align:center"><button class="primary" onclick="goFilters()">下一步 →</button></div>
    </section>

    <section id="filters" class="screen">
      <div class="section-title">
        <h2>🍴 再告訴我一點點</h2><p>不想設定也沒關係，可以直接選「不限」</p>
      </div>
      <div class="filters">
        <div class="filter-card">
          <h3>💰 預算</h3>
          <div class="pills" id="budgetPills">
            <button class="pill" data-budget="100以下" onclick="pickBudget(this)">🪙 100 元以下</button>
            <button class="pill" data-budget="100-200" onclick="pickBudget(this)">🪙🪙 100～200 元</button>
            <button class="pill" data-budget="200-400" onclick="pickBudget(this)">🪙🪙🪙 200～400 元</button>
            <button class="pill" data-budget="400以上" onclick="pickBudget(this)">🪙🪙🪙🪙 400 元以上</button>
            <button class="pill selected" data-budget="不限" onclick="pickBudget(this)">不限</button>
          </div>
        </div>
        <div class="filter-card diet">
          <h3>🚫 今天不吃什麼？</h3>
          <div class="small" style="margin:-7px 0 12px">✨ 不限 = 不排除任何食物</div>
          <div class="pills" id="dietPills">
            <button class="pill selected" data-diet="不限" onclick="toggleDiet(this)">✨ 不限</button>
            <button class="pill" data-diet="香菜" onclick="toggleDiet(this)">🥬 香菜</button>
            <button class="pill" data-diet="豬肉" onclick="toggleDiet(this)">🐷 豬肉</button>
            <button class="pill" data-diet="牛肉" onclick="toggleDiet(this)">🐮 牛肉</button>
            <button class="pill" data-diet="雞肉" onclick="toggleDiet(this)">🐔 雞肉</button>
            <button class="pill" data-diet="海鮮" onclick="toggleDiet(this)">🦐 海鮮</button>
            <button class="pill" data-diet="辣" onclick="toggleDiet(this)">🌶️ 辣</button>
            <button class="pill" data-diet="奶類" onclick="toggleDiet(this)">🥛 奶類</button>
            <button class="pill" data-diet="蛋" onclick="toggleDiet(this)">🥚 蛋</button>
          </div>
        </div>
      </div>
      <div class="filter-actions"><button class="primary" onclick="findRestaurants()">🔎 找餐廳！</button></div>
    </section>

    <section id="wheelScreen" class="screen">
      <div class="section-title">
        <h2>🎡 今天吃什麼？</h2>
        <p id="matchText"></p>
      </div>
      <div class="wheel-area">
        <div class="wheel-shell"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div>
        <div id="currentTimeBadge" class="status" style="margin-bottom:4px">🕐 現在時間</div>
        <div class="status-list">
          <span class="status green">🟢 營業中</span>
          <span class="status yellow">🟡 快關店</span>
          <span class="status blue">🔵 即將開店</span>
        </div>
        <button class="primary spin-btn" id="spinBtn" onclick="spinWheel()">🎡 開始轉！</button>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="section-title"><h2>🎉 恭喜抽中！</h2><p>今天就吃這家吧！</p></div>
      <div id="resultCard"></div>
    </section>

    <section id="collection" class="screen">
      <div class="collection-head">
        <div><h2>📖 我的美食圖鑑</h2><div id="collectionCount" class="small"></div></div>
        <button class="secondary" onclick="showScreen('home')">🏠 回首頁</button>
      </div>
      <div id="collectionGrid" class="collection-grid"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
</div>

<script>
// 圖片採用內嵌 SVG Base64，確保單一檔案獨立運作絕不破圖
const svgImgs = {
  chicken: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23f5c6cb"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍗</text></svg>',
  curry: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23ffeeba"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍛</text></svg>',
  ramen: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23b8daff"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍜</text></svg>',
  brunch: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23c3e6cb"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🥪</text></svg>',
  rice: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23ffe8a1"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍚</text></svg>',
  dessert: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23e2d9f3"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍰</text></svg>',
  noodle: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23f8d7da"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍝</text></svg>',
  hotpot: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23d4edda"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍲</text></svg>',
  snack: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23ffe5d0"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍢</text></svg>',
  riceball: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23e8daef"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍙</text></svg>',
  drink: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23d1ecf1"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🧋</text></svg>',
  bakery: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23fff3cd"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🍞</text></svg>',
  convenience: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="%23d6d8db"/><circle cx="200" cy="150" r="70" fill="%23fff" stroke="%23493b32" stroke-width="4"/><text x="200" y="160" font-size="40" text-anchor="middle">🏪</text></svg>'

function parseTime(s){const [h,m]=s.split(":").map(Number);return h*60+m}
function getOpenStatus(r){
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  const open=parseTime(r.open);
  let close=parseTime(r.close);

  if(close<=open) close+=1440;
  let c=cur;
  if(c<open) c+=1440;

  if(c>=open && c<=close){
    const remain=close-c;
    if(remain<=30) return {label:"快關店",cls:"yellow",detail:`${remain} 分鐘後打烊`};
    return {label:"營業中",cls:"green",detail:"現在可以用餐"};
  }

  let diff=open-cur;
  if(diff<0) diff+=1440;
  if(diff<=30) return {label:"即將開店",cls:"blue",detail:`${diff} 分鐘後開始營業`};

  return null;
}
function budgetOK(r){
  if(state.budget==="不限")return true;
  if(state.budget==="100以下")return r.price<=100;
  if(state.budget==="100-200")return r.price>100&&r.price<=200;
  if(state.budget==="200-400")return r.price>200&&r.price<=400;
  if(state.budget==="400以上")return r.price>400;
  return true;
}
function findRestaurants(){
  state.matches=restaurants.filter(r=>{
    if(r.district!==state.district||!r.meals.includes(state.meal)||!budgetOK(r))return false;
    if(state.diet.some(d=>r.tags.includes(d)))return false;
    return !!getOpenStatus(r);
  });
  if(!state.matches.length){
    showEmpty();
    return;
  }
  document.getElementById("matchText").textContent=`找到 ${state.matches.length} 家符合條件的店家，準備讓命運決定！`;
  document.getElementById("currentTimeBadge").textContent="🕐 現在時間 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
  state.angle=0;drawWheel();showScreen("wheelScreen");
}

function drawWheel(){
  const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),n=state.matches.length;
  const cx=350,cy=350,r=335;ctx.clearRect(0,0,700,700);
  const colors=["#f6d889","#b9d49d","#eab4aa","#9fc5d0","#f2c18e","#c9b7d9"];
  state.matches.forEach((item,i)=>{
    const a0=state.angle+i*2*Math.PI/n,a1=state.angle+(i+1)*2*Math.PI/n;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="#493b32";ctx.lineWidth=5;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate((a0+a1)/2);
    ctx.textAlign="right";ctx.fillStyle="#493b32";ctx.font="bold 25px sans-serif";
    let name=item.name.length>9?item.name.slice(0,9)+"…":item.name;ctx.fillText(name,r-25,8);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,63,0,Math.PI*2);ctx.fillStyle="#fffdf6";ctx.fill();ctx.strokeStyle="#493b32";ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle="#493b32";ctx.textAlign="center";ctx.font="bold 25px sans-serif";ctx.fillText("今天吃",cx,cy-2);ctx.fillText("什麼？",cx,cy+28);
}
function spinWheel(){
  if(state.spinning)return;
  state.spinning=true;document.getElementById("spinBtn").disabled=true;
  const n=state.matches.length, targetIndex=Math.floor(Math.random()*n);
  const slice=2*Math.PI/n;
  const target=-Math.PI/2-(targetIndex+.5)*slice;
  const start=state.angle, extra=8*Math.PI+((target-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI), end=start+extra;
  const duration=4200,startTime=performance.now();
  function anim(now){
    const p=Math.min(1,(now-startTime)/duration),ease=1-Math.pow(1-p,4);
    state.angle=start+(end-start)*ease;drawWheel();
    if(p<0.82 && Math.floor(p*34)!==Math.floor(((p-0.012)*34))){wheelTick();}
    if(p<1){requestAnimationFrame(anim)}else{
      state.spinning=false;document.getElementById("spinBtn").disabled=false;
      state.current=state.matches[targetIndex];winSound();renderResult(state.current);showScreen("result");
    }
  }
  requestAnimationFrame(anim);
}
function convenienceSuggestion(r){
  if(!r.convenience)return "";
  const h=new Date().getHours();
  if(h>=5&&h<10)return "🌅 現在推薦：御飯糰＋熱咖啡";
  if(h>=10&&h<14)return "☀️ 現在推薦：微波便當＋茶葉蛋";
  if(h>=14&&h<18)return "🍰 現在推薦：地瓜＋咖啡／茶";
  if(h>=18&&h<23)return "🌇 現在推薦：關東煮＋御飯糰";
  return "🌙 現在推薦：關東煮＋熱飲";
}

      <div class="card-actions">
        <button class="secondary favorite ${fav?"active":""}" onclick="toggleFavorite(${r.id})">${fav?"❤️ 已收藏":"♡ 收藏這間店"}</button>

}
function toggleFavorite(id){
  favoriteSound();
  if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else favorites.push(id);
  localStorage.setItem("foodFavorites",JSON.stringify(favorites));
  if(state.current)renderResult(state.current);
  toast(favorites.includes(id)?"❤️ 已加入美食圖鑑！":"已取消收藏");
}
function openMaps(q){window.open("https://www.google.com/maps/search/?api=1&query="+q,"_blank")}
function spinAgain(){
  const available=state.matches.filter(x=>x.id!==state.current?.id);
  if(!available.length){toast("🎉 這輪已經只有這一家啦！");return}
  state.matches=available;document.getElementById("matchText").textContent=`還有 ${available.length} 家可以抽！`;
  state.angle=0;drawWheel();showScreen("wheelScreen");
}
function renderCollection(){
  const grid=document.getElementById("collectionGrid");
  const items=restaurants.filter(r=>favorites.includes(r.id));
  document.getElementById("collectionCount").textContent=`已收藏 ${items.length} 家｜不用登入，收藏保存在這個瀏覽器`;
  if(!items.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">🃏</div><h2>圖鑑還是空的</h2><p>去轉盤找一家喜歡的店，把它收進來吧！</p><button class="primary" onclick="showScreen('meal')">🍴 開始覓食</button></div>`;
    return;
  }
  grid.innerHTML=items.map(r=>`<article class="mini-card">
    <div class="card-photo-box">
      <img class="card-photo" src="${r.photo}" alt="${r.name}">
    </div>
    <div class="mini-body"><h3>${r.name}</h3><p>⭐ ${r.rating} ${r.type}</p><p>📍 嘉義市${r.district}</p>
    <button class="secondary" style="margin-top:8px" onclick="openMaps('${encodeURIComponent(r.name+" "+r.address)}')">🗺️ 查看地圖</button>
    <button class="secondary" style="margin-top:8px" onclick="toggleFavorite(${r.id})">💔 移除</button></div>
  </article>`).join("");
}

function updateCuteClock(){
  const now=new Date();
  const t=now.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
  const h=now.getHours();
  let label=h<5?"🌙 夜深了":h<10?"🌅 早餐時間":h<14?"☀️ 午餐時間":h<17?"🍰 點心時間":h<21?"🌇 晚餐時間":"🌙 消夜時間";
  document.getElementById("cuteTime").textContent=t;
  document.getElementById("cuteTimeLabel").textContent=label;
}
updateCuteClock();setInterval(updateCuteClock,1000);

let soundOn = true;
function toggleMusic(){
  soundOn = !soundOn;
  const musicText = document.getElementById("musicText");
  const musicToggle = document.getElementById("musicToggle");
  if(soundOn){
    musicText.textContent = "音效特效 ON";
    musicToggle.classList.add("on");
    toast("🔊 音效已開啟");
  }else{
    musicText.textContent = "音效特效 OFF";
    musicToggle.classList.remove("on");
    toast("🔇 音效已關閉");
  }
}

// 內建 Web Audio API 音效合成引擎
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function uiClick() {
  if(!soundOn) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.05);
  } catch(e){}
}

function wheelTick() {
  if(!soundOn) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.03);
  } catch(e){}
}

function winSound() {
  if(!soundOn) return;
  try {
    const ctx = getAudioContext();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 0.25);
    });
  } catch(e){}
}

function favoriteSound() {
  if(!soundOn) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

document.addEventListener("click", function(event){
  getAudioContext(); // 互動時喚醒音訊環境
  const el=event.target.closest("button, .nav-btn, .brand, .choice, .district, .pill");
  if(!el || el.id==="musicToggle" || el.disabled) return;
  if(el.id==="spinBtn") { uiClick(); return; }
  if(el.classList.contains("favorite")) { favoriteSound(); return; }
  uiClick();
}, true);
</script>
